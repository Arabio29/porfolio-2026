<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The living system reactor study</title>
  <desc id="desc">A cobalt procedural reactor made from rings, nodes and fine registration lines.</desc>
  <defs>
    <radialGradient id="field" cx="62%" cy="47%" r="74%"><stop offset="0" stop-color="#17275f"/><stop offset=".42" stop-color="#0d1230"/><stop offset="1" stop-color="#080808"/></radialGradient>
    <linearGradient id="cobalt" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7e9aff"/><stop offset=".28" stop-color="#2957ff"/><stop offset=".7" stop-color="#1635bc"/><stop offset="1" stop-color="#adc0ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#f1efe9" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#field)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity=".32"/>
  <g transform="translate(1040 510)" fill="none" stroke="url(#cobalt)" filter="url(#glow)">
    <ellipse rx="290" ry="120" stroke-width="10" transform="rotate(-28)"/>
    <ellipse rx="250" ry="170" stroke-width="5" transform="rotate(28)"/>
    <ellipse rx="205" ry="245" stroke-width="4" transform="rotate(76)"/>
    <circle r="105" stroke-width="12"/>
    <circle r="28" fill="#2957ff" stroke-width="4"/>
    <path d="M-360 0H360M0-320V320M-250-205L250 205M-250 205L250-205" stroke-width="2" stroke-dasharray="6 18"/>
    <g fill="#f1efe9" stroke="none"><circle cx="-290" cy="-120" r="8"/><circle cx="255" cy="-165" r="6"/><circle cx="185" cy="208" r="9"/><circle cx="-195" cy="170" r="5"/></g>
  </g>
  <g fill="#f1efe9" font-family="monospace" font-size="18" letter-spacing="4"><text x="80" y="112">FIG. 01 / CODE REACTOR</text><text x="80" y="900">INPUT → STRUCTURE → EXPERIENCE</text><text x="1300" y="900">2026 / LIVE STUDY</text></g>
</svg>
