  </g>
  <g fill="#f1efe9" font-family="monospace" font-size="18" letter-spacing="4"><text x="80" y="112">STRUCTURAL DETAIL / 02</text><text x="80" y="900">CHROME / COBALT / CONTROLLED ENERGY</text></g>
