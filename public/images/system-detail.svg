<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Reactor structural detail</title>
  <desc id="desc">A close-up of blue and chrome orbital structures with engineering measurements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset=".52" stop-color="#101936"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <linearGradient id="chrome" x1="0" x2="1"><stop stop-color="#63687b"/><stop offset=".25" stop-color="#f1efe9"/><stop offset=".5" stop-color="#70778a"/><stop offset=".72" stop-color="#f1efe9"/><stop offset="1" stop-color="#363b4d"/></linearGradient>
